services:
  tikscope:
    container_name: tikscope
    build: .
    restart: unless-stopped
    # NET_RAW for the ICMP probes, nothing else.
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    security_opt: [no-new-privileges:true]
    ports:
      - "3000:3000"
      - "5354:5354/udp"
    volumes:
      - ./data:/data
    # Every variable in .env (copy .env.example) reaches the collector.
    env_file:
      - path: .env
        required: false
