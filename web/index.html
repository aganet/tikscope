<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tikscope</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2236%22 stroke=%22%2329C7D9%22 stroke-width=%222%22 fill=%22none%22/%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2223%22 stroke=%22%2329C7D9%22 stroke-width=%221.5%22 fill=%22none%22 opacity=%22.7%22/%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%229%22 stroke=%22%2329C7D9%22 stroke-width=%222%22 fill=%22none%22/%3E%3Cpath d=%22M50 50 L76 25 A36 36 0 0 1 85 50 Z%22 fill=%22%2329C7D9%22 opacity=%22.22%22/%3E%3Cpath d=%22M50 50 L76 25%22 stroke=%22%2329C7D9%22 stroke-width=%222.5%22/%3E%3Ccircle cx=%2276%22 cy=%2225%22 r=%224%22 fill=%22%2375E6B1%22/%3E%3Ccircle cx=%2250%22 cy=%2214%22 r=%223%22 fill=%22%2329C7D9%22/%3E%3Ccircle cx=%2217%22 cy=%2250%22 r=%223%22 fill=%22%2329C7D9%22/%3E%3Cpath d=%22M50 5 V14 M50 86 V95 M5 50 H14 M86 50 H95%22 stroke=%22%2329C7D9%22 stroke-width=%222%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div>
      <h1>tikscope <span class="tagline">Network visibility &middot; Router monitoring</span></h1>
      <p class="muted"><span id="router-name"></span><span id="updated">Connecting</span></p>
    </div>
  </div>
  <div class="controls">
    <select id="range" aria-label="Time range">
      <option value="1h">Last hour</option>
      <option value="6h">Last 6 hours</option>
      <option value="24h" selected>Last 24 hours</option>
      <option value="7d">Last 7 days</option>
      <option value="30d">Last 30 days</option>
    </select>
    <div class="refresh" id="refresh-box">
      <button id="pause" class="icon-btn" title="Pause auto refresh" aria-label="Pause auto refresh"></button>
      <select id="interval" aria-label="Refresh interval">
        <option value="1">1s</option>
        <option value="2">2s</option>
        <option value="5">5s</option>
        <option value="10" selected>10s</option>
        <option value="30">30s</option>
        <option value="60">1m</option>
        <option value="300">5m</option>
      </select>
    </div>
    <button id="refresh" class="icon-btn" title="Refresh now" aria-label="Refresh now"></button>
    <button id="theme" class="icon-btn" title="Toggle dark mode" aria-label="Toggle dark mode"></button>
    <button id="logout" class="icon-btn" title="Sign out" aria-label="Sign out"></button>
  </div>
</header>

<nav class="tabs" id="tabs" aria-label="Sections">
  <a href="#overview" data-tab="overview">Overview</a>
  <a href="#dns" data-tab="dns">DNS</a>
  <a href="#network" data-tab="network">Network</a>
  <a href="#devices" data-tab="devices">Devices</a>
  <a href="#events" data-tab="events">Events</a>
  <a href="#system" data-tab="system">System</a>
  <a href="#wall" data-tab="wall" title="Full-width layout for a TV or monitor">Wall</a>
</nav>

<main id="main"></main>

<div id="drawer" class="drawer" hidden>
  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="drawer-panel" role="dialog" aria-modal="true">
    <button class="icon-btn drawer-close" id="drawer-close" aria-label="Close"></button>
    <div id="drawer-body"></div>
  </aside>
</div>

<div id="tooltip" class="tooltip" hidden></div>
<div id="toast" class="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
