<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tikscope</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f5bd5'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='white' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='3' fill='white'/%3E%3Cpath d='M16 7v4M16 21v4M7 16h4M21 16h4' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div>
      <h1>tikscope</h1>
      <p id="updated" class="muted">Connecting</p>
    </div>
  </div>
  <div class="controls">
    <select id="range" aria-label="Time range">
      <option value="1h">Last hour</option>
      <option value="6h">Last 6 hours</option>
      <option value="24h" selected>Last 24 hours</option>
      <option value="7d">Last 7 days</option>
      <option value="30d">Last 30 days</option>
    </select>
    <div class="refresh" id="refresh-box">
      <button id="pause" class="icon-btn" title="Pause auto refresh" aria-label="Pause auto refresh"></button>
      <select id="interval" aria-label="Refresh interval">
        <option value="1">1s</option>
        <option value="2">2s</option>
        <option value="5">5s</option>
        <option value="10" selected>10s</option>
        <option value="30">30s</option>
        <option value="60">1m</option>
        <option value="300">5m</option>
      </select>
    </div>
    <button id="refresh" class="icon-btn" title="Refresh now" aria-label="Refresh now"></button>
    <button id="theme" class="icon-btn" title="Toggle dark mode" aria-label="Toggle dark mode"></button>
  </div>
</header>

<nav class="tabs" id="tabs" aria-label="Sections">
  <a href="#overview" data-tab="overview">Overview</a>
  <a href="#dns" data-tab="dns">DNS</a>
  <a href="#network" data-tab="network">Network</a>
  <a href="#devices" data-tab="devices">Devices</a>
  <a href="#events" data-tab="events">Events</a>
  <a href="#system" data-tab="system">System</a>
</nav>

<main id="main"></main>

<div id="drawer" class="drawer" hidden>
  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="drawer-panel" role="dialog" aria-modal="true">
    <button class="icon-btn drawer-close" id="drawer-close" aria-label="Close"></button>
    <div id="drawer-body"></div>
  </aside>
</div>

<div id="tooltip" class="tooltip" hidden></div>
<div id="toast" class="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
