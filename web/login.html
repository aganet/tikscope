<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in, tikscope</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233871dc'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='white' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='3' fill='white'/%3E%3Cpath d='M16 7v4M16 21v4M7 16h4M21 16h4' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body class="auth-page">
<main class="auth-card card" id="auth">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <div>
      <h1>tikscope</h1>
      <p class="muted" id="auth-sub">Checking</p>
    </div>
  </div>
  <form class="form" id="auth-form" hidden autocomplete="on">
    <div id="auth-fields"></div>
    <p class="form-error" id="auth-error" role="alert" hidden></p>
    <button type="submit" class="btn primary" id="auth-submit">Sign in</button>
  </form>
</main>
<script type="module" src="js/login.js"></script>
</body>
</html>
